<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f958c"/>
      <stop offset="0.5" stop-color="#087d79"/>
      <stop offset="1" stop-color="#04554f"/>
    </linearGradient>
    <radialGradient id="score" cx="0.5" cy="0.38" r="0.78">
      <stop offset="0" stop-color="#0e9a92"/>
      <stop offset="1" stop-color="#065f59"/>
    </radialGradient>
    <linearGradient id="sbeam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee9d6"/>
      <stop offset="1" stop-color="#eafffb"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sbg)"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1"/>

  <!-- 堆芯截面 -->
  <circle cx="32" cy="32" r="21" fill="url(#score)" stroke="#cfeae4" stroke-opacity="0.38" stroke-width="1.2"/>

  <!-- 指套管阵：十字五点 -->
  <g fill="#e8f6f2" fill-opacity="0.42">
    <circle cx="32" cy="22" r="2.7"/>
    <circle cx="22" cy="32" r="2.7"/>
    <circle cx="32" cy="32" r="3"/>
    <circle cx="32" cy="42" r="2.7"/>
  </g>

  <!-- 检出管位 -->
  <circle cx="42" cy="32" r="5.5" fill="#f6c04e" fill-opacity="0.35"/>
  <circle cx="42" cy="32" r="2.9" fill="#f2b64a" stroke="#ffe0a1" stroke-width="0.8"/>

  <!-- 涡流检测信号 -->
  <path d="M 14 46 C 21 43 24 39 30 38 C 35 37 36.5 33 41 30.5 C 44.5 28.5 47 27 50 25.5"
        fill="none" stroke="url(#sbeam)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="50" cy="25.5" r="2.2" fill="#ffffff"/>
</svg>
