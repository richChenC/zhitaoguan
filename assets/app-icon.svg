<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f958c"/>
      <stop offset="0.5" stop-color="#087d79"/>
      <stop offset="1" stop-color="#04554f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0.6" x2="0" y2="1">
      <stop offset="0" stop-color="#03201e" stop-opacity="0"/>
      <stop offset="1" stop-color="#03201e" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.38" r="0.78">
      <stop offset="0" stop-color="#0e9a92"/>
      <stop offset="1" stop-color="#065f59"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee9d6"/>
      <stop offset="1" stop-color="#eafffb"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c04e" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#f6c04e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f6c04e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#sheen)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#vignette)"/>
  <rect x="9.75" y="9.75" width="236.5" height="236.5" rx="52.75" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.5"/>

  <!-- 象限刻度：仪器表盘语言 -->
  <g stroke="#d8f2ec" stroke-opacity="0.5" stroke-width="3.5" stroke-linecap="round">
    <line x1="128" y1="35" x2="128" y2="26"/>
    <line x1="128" y1="221" x2="128" y2="230"/>
    <line x1="35" y1="128" x2="26" y2="128"/>
    <line x1="221" y1="128" x2="230" y2="128"/>
  </g>

  <!-- 堆芯截面 -->
  <circle cx="128" cy="128" r="84" fill="url(#core)" stroke="#cfeae4" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <path d="M 58 128 H 198 M 128 58 V 198" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- 指套管阵：圆形排布，去四角，贴合真实堆芯 -->
  <g fill="#e8f6f2" fill-opacity="0.34">
    <circle cx="100" cy="72" r="7"/>
    <circle cx="128" cy="72" r="7"/>
    <circle cx="156" cy="72" r="7"/>
    <circle cx="72" cy="100" r="7"/>
    <circle cx="100" cy="100" r="7"/>
    <circle cx="128" cy="100" r="7"/>
    <circle cx="184" cy="100" r="7"/>
    <circle cx="72" cy="128" r="7"/>
    <circle cx="100" cy="128" r="7"/>
    <circle cx="128" cy="128" r="7.5" fill-opacity="0.5"/>
    <circle cx="72" cy="156" r="7"/>
    <circle cx="100" cy="156" r="7"/>
    <circle cx="128" cy="156" r="7"/>
    <circle cx="156" cy="156" r="7"/>
    <circle cx="184" cy="156" r="7"/>
    <circle cx="100" cy="184" r="7"/>
    <circle cx="128" cy="184" r="7"/>
    <circle cx="156" cy="184" r="7"/>
  </g>

  <!-- 检出管位：金色高亮 + 选中环 -->
  <circle cx="156" cy="100" r="17" fill="url(#goldGlow)"/>
  <circle cx="156" cy="100" r="11.5" fill="none" stroke="#f2b64a" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="156" cy="100" r="7.5" fill="#f2b64a" stroke="#ffe0a1" stroke-width="1.5"/>

  <!-- 涡流检测信号：阻抗平面曲线穿过管阵 -->
  <path d="M 60 176 C 76 170 86 152 104 150 C 116 148.5 122 158 133 152.5 C 148 145 150 124 166 112 C 180 101 188 95 198 90"
        fill="none" stroke="#7ee9d6" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/>
  <path d="M 60 176 C 76 170 86 152 104 150 C 116 148.5 122 158 133 152.5 C 148 145 150 124 166 112 C 180 101 188 95 198 90"
        fill="none" stroke="url(#beam)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 探头当前位置 -->
  <circle cx="198" cy="90" r="10" fill="#baf5e9" fill-opacity="0.3"/>
  <circle cx="198" cy="90" r="5.5" fill="#ffffff"/>
</svg>
